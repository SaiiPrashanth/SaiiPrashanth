<svg xmlns="http://www.w3.org/2000/svg" width="700" height="90" viewBox="0 0 700 90">
  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset=".5" stop-color="#ff00ff"/>
      <stop offset="1" stop-color="#ffff00"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="350" y="46" text-anchor="middle" fill="url(#neon)" filter="url(#glow)"
        font-family="Segoe UI, sans-serif" font-size="30" font-weight="700"
        letter-spacing="2">Hello! i am Sai, Nice to meet ya .</text>
  <text x="350" y="73" text-anchor="middle" fill="#8a2be2"
        font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="4">
    HELLO WORLD !
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
